[project]
name = "project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7",
    "faiss-cpu>=1.15.1",
    "grandalf>=0.8",
    "ipykernel>=7.4.0",
    "langchain>=1.4",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2",
    "langsmith>=0.14",
    "litellm>=1.106",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
project = "project:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
